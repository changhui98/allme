# 개발 모드 (핫 리로드): docker compose up --build
# 백엔드 개발 시 DB만 띄우기: docker compose up -d db
# 프로덕션은 docker-compose.prod.yml 참조
services:
  db:
    image: postgres:16-alpine
    ports:
      # 호스트 5433 → 컨테이너 5432. 사귐 서비스 PostgreSQL(호스트 5432)과 충돌 방지.
      - "5433:5432"
    env_file: ./back/.env.dev
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 탈퇴 회원 보관 전용 DB — 본 DB와 물리 분리 (탈퇴 시 개인정보 이관처)
  db-archive:
    image: postgres:16-alpine
    ports:
      # 호스트 5434 → 컨테이너 5432 (5432 사귐·5433 본 DB와 충돌 방지)
      - "5434:5432"
    environment:
      POSTGRES_DB: ${ARCHIVE_POSTGRES_DB:-allme_archive}
      POSTGRES_USER: ${ARCHIVE_POSTGRES_USER:-allme}
      POSTGRES_PASSWORD: ${ARCHIVE_POSTGRES_PASSWORD:-allme}
    volumes:
      - db-archive-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  back:
    build:
      context: ./back
    ports:
      - "8080:8080"
    env_file: ./back/.env.dev
    environment:
      IMAGES_ROOT: /images
      ARCHIVE_DB_HOST: db-archive
      ARCHIVE_DB_PORT: 5432
    volumes:
      # 업로드 이미지 — 저장소 루트 images/를 그대로 사용 (front·back·images 구조 유지)
      - ./images:/images
    depends_on:
      db:
        condition: service_healthy
      db-archive:
        condition: service_healthy
    # 소스 수정하며 개발할 때는 호스트에서 ./gradlew bootRun 사용 (localhost:5433).
    # 이 서비스는 전체 스택을 한 번에 띄울 때 쓰며, 코드 반영은 --build 재빌드 필요.
    restart: unless-stopped

  front:
    build:
      context: ./front
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./front:/app # 소스 실시간 반영 (핫 리로드)
      - /app/node_modules # 호스트 node_modules(macOS arm64) 차단
      - /app/.next # 호스트 .next 산출물 차단
    # 핫 리로드는 Docker Desktop의 VirtioFS 파일 공유가 호스트 파일 이벤트를
    # 전달해주는 것에 의존한다 (Settings → General → VirtioFS 활성화 필수).
    # 주의: NEXT_WATCH_POLLING(watchOptions.pollIntervalMs) 폴링은 Next 16.2.9
    # Turbopack에서 파일 감시 자체를 죽이는 문제가 있어 사용하지 않는다.
    restart: unless-stopped

volumes:
  db-data:
  db-archive-data:
