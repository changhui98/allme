# 세션은 톰캣 인메모리(재시작 시 전부 소멸 — 근본 해결은 추후 Redis 세션 스토어 도입).
# 타임아웃 기본 30m을 명시해 정책을 드러낸다. 개발 시 만료 UX 테스트는
# SESSION_TIMEOUT=1m 등으로 단축(톰캣 최소 단위 1분).
server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}

spring:
  application:
    name: back
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:allme}
    username: ${DB_USERNAME:allme}
    password: ${DB_PASSWORD:allme}
  jpa:
    hibernate:
      ddl-auto: update # 개발 전용. 운영 전환 시 validate + 마이그레이션 도구로 교체
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

# 탈퇴 회원 보관 전용 DB (본 DB와 물리 분리) — 탈퇴 시 개인정보 이관처.
# JPA 미사용(JdbcClient 단순 INSERT) — global/config/ArchiveDataSourceConfig 참조.
archive:
  datasource:
    url: jdbc:postgresql://${ARCHIVE_DB_HOST:localhost}:${ARCHIVE_DB_PORT:5434}/${ARCHIVE_DB_NAME:allme_archive}
    username: ${ARCHIVE_DB_USERNAME:allme}
    password: ${ARCHIVE_DB_PASSWORD:allme}

portone:
  base-url: https://api.portone.io
  api-secret: ${PORTONE_API_SECRET:}

# 개인정보 필드 암호화 키 (base64 32바이트). 기본값은 개발 전용 —
# 호스트 bootRun과 도커 back이 같은 dev DB를 공유하므로 .env.dev와 반드시 같은 값을 유지할 것.
# 운영은 .env.prod에서 별도 키 주입 (openssl rand -base64 32 로 생성).
crypto:
  enc-key: ${CRYPTO_ENC_KEY:7/LN5CZZYTbY+AKSgzJsxNWxQFQGBkUT+Ule6dz15XE=}
  hmac-key: ${CRYPTO_HMAC_KEY:XjwgjAJa+V8JwtyfOX0KyAKwV2S9vnlVqvfg3C3/4Hw=}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}

app:
  # 업로드 이미지 루트 — 저장소 루트의 images/ (front·back과 나란히).
  # 호스트 bootRun은 back/이 작업 디렉터리라 ../images, 도커는 볼륨 마운트된 /images.
  images-root: ${IMAGES_ROOT:../images}
  # true면 기동 시 역할별 테스트 계정 4종(testuser 등, 비밀번호 Test1234!)을 시드 — 개발 전용, 운영 금지.
  seed-test-accounts: ${SEED_TEST_ACCOUNTS:false}
